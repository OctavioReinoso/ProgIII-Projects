<header class="encabezado">
  <h1>Escuela - Angular Forms</h1>
  <nav>
    @for (enlace of enlaces; track enlace.ruta) {
      <a [routerLink]="enlace.ruta" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">{{ enlace.texto }}</a>
    }
  </nav>
</header>

<main class="contenido">
  <router-outlet />
</main>
